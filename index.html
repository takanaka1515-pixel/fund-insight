<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="theme-color" content="#0e1728">
<title>投信の中身 | 自分用ファンド分析アプリ</title>
<style>
:root{color-scheme:dark;--bg:#091121;--panel:#131f33;--panel2:#1b2b41;--border:#2a3950;--txt:#eaf2ff;--sub:#a5b7ca;--aqua:#54d7c1;--blue:#7ea7ff;--yellow:#ffd68b;--red:#ffb7a6}*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:var(--bg);font-family:-apple-system,BlinkMacSystemFont,'Noto Sans JP','Hiragino Kaku Gothic ProN',sans-serif;color:var(--txt)}button,input,textarea{font:inherit}button{cursor:pointer}a{color:var(--aqua)}.layout{max-width:1120px;margin:auto;padding:28px 18px 72px}.header{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:24px}.brand{display:flex;gap:12px;align-items:center}.logo{width:43px;height:43px;border-radius:14px;background:linear-gradient(145deg,#59dbc1,#648bf0);display:grid;place-items:center;color:#071323;font-weight:900;font-size:22px}.brand h1{margin:0;font-size:20px;letter-spacing:.02em}.brand small{color:var(--sub);font-size:12px}.chip{font-size:12px;border:1px solid #45616e;border-radius:30px;padding:6px 10px;color:#a9f1e2;background:#11383a}.nav{display:flex;gap:8px;padding:6px;border-radius:14px;background:#111e31;margin-bottom:22px;overflow:auto}.nav button{border:0;white-space:nowrap;background:transparent;color:var(--sub);padding:11px 19px;border-radius:10px;font-weight:700}.nav button.active{color:#082525;background:var(--aqua)}.card{background:var(--panel);border:1px solid var(--border);border-radius:18px;padding:21px}.intro{color:var(--sub);font-size:14px;line-height:1.8;margin:0 0 17px}.cards{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin-bottom:20px}.fund{color:var(--txt);border-radius:14px;border:1px solid var(--border);background:var(--panel);padding:16px;text-align:left;min-height:130px}.fund.active{outline:2px solid var(--aqua);background:#16313d}.fund b{display:block;line-height:1.4;font-size:15px}.fund small{display:block;color:var(--sub);margin-top:11px;font-size:12px}.fund em{display:inline-block;font-style:normal;margin-top:9px;color:var(--aqua);font-size:12px}.headrow{display:flex;justify-content:space-between;align-items:flex-start;gap:14px;flex-wrap:wrap}.headrow h2{font-size:23px;margin:2px 0 7px}.muted{color:var(--sub)}.tiny{font-size:12px}.pill{border:1px solid #385a61;border-radius:14px;padding:5px 9px;font-size:11px;color:#a2f4e3;background:#0e2c30}.warn{color:var(--yellow)}.grid{display:grid;grid-template-columns:1.4fr 1fr;gap:16px;margin-top:16px}.item{display:flex;gap:12px;align-items:center;margin:13px 0}.rank{color:var(--sub);width:18px;font-size:12px}.barbody{flex:1;min-width:0}.barlabel{display:flex;justify-content:space-between;gap:8px;font-size:13px;margin-bottom:5px}.barlabel span:first-child{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.track{height:9px;background:#263750;border-radius:100px;overflow:hidden}.track>div{height:100%;background:linear-gradient(90deg,var(--blue),var(--aqua));border-radius:100px}.mrow{display:flex;align-items:center;justify-content:space-between;margin:10px 0;gap:12px;font-size:13px}.mrow div:first-child{max-width:70%}.sector{display:flex;height:12px;border-radius:12px;overflow:hidden;background:#2c3e55;margin:17px 0}.sector>span{min-width:0}.legend{display:flex;gap:12px 18px;flex-wrap:wrap}.legend span{display:flex;gap:6px;align-items:center;font-size:12px;color:var(--sub)}.square{width:9px;height:9px;border-radius:2px;display:inline-block}.callout{background:#142939;border:1px solid #275c66;border-radius:13px;padding:14px 16px;margin-top:14px;color:#d4e4f3;font-size:13px;line-height:1.7}.empty{padding:35px 20px;text-align:center;color:var(--sub)}.button{border:none;border-radius:9px;padding:11px 15px;background:var(--aqua);font-size:13px;font-weight:700;color:#062627}.button.secondary{background:var(--panel2);color:var(--txt);border:1px solid var(--border)}.button.danger{background:#493039;color:#ffd9da}.btnrow{display:flex;flex-wrap:wrap;gap:10px;margin-top:16px}label{display:block;font-size:12px;color:var(--sub);margin-bottom:6px}input,textarea,select{border-radius:10px;padding:11px;width:100%;color:var(--txt);background:#0e1929;border:1px solid #38506a;outline:none}textarea{min-height:240px;resize:vertical;line-height:1.7}.formgrid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.formgrid .full{grid-column:1/-1}.overlap{display:grid;gap:12px}.overlapcard{padding:14px 17px;border:1px solid var(--border);border-radius:12px;background:#15233a}.overlapcard b{display:block;font-size:15px;margin-bottom:7px}.overlapcard small{color:var(--sub)}footer{margin-top:26px;color:var(--sub);line-height:1.8;font-size:12px}@media(max-width:840px){.cards{grid-template-columns:repeat(2,minmax(0,1fr))}.grid{grid-template-columns:1fr}}@media(max-width:500px){.layout{padding:18px 13px 60px}.header{align-items:flex-start}.brand h1{font-size:18px}.chip{font-size:10px}.card{padding:17px}.formgrid{grid-template-columns:1fr}.headrow h2{font-size:21px}}
</style>
</head>
<body><div class="layout">
<header class="header"><div class="brand"><div class="logo">投</div><div><h1>投信の中身</h1><small>自分用・組入銘柄分析アプリ</small></div></div><span class="chip">試作版 v0.1</span></header>
<nav class="nav"><button class="active" data-tab="funds">ファンド分析</button><button data-tab="overlap">銘柄の重複</button><button data-tab="edit">データ更新</button></nav>
<div id="root"></div>
<footer>このアプリはブラウザ内で動く試作版です。証券口座へのログインは不要です。手入力したデータは、この端末のブラウザにのみ保存されます（閲覧履歴・ブラウザデータを削除すると消える場合があります）。<br>初期データは資料の特定基準日時点のもので、リアルタイムの組入情報ではありません。WCMとインベスコの初期値は第三者サイトの自動抽出情報で、公式資料との照合は未完了です。投資助言目的ではありません。</footer>
</div>
<script>
const base = [
{id:'invesco',name:'インベスコ世界厳選',full:'インベスコ世界厳選株式オープン〈為替ヘッジなし〉（毎月決算型）',date:'2026-09-30',status:'参考値・要公式照合',basis:'ファンド上位10銘柄（第三者の月次資料抽出）',source:'https://www.invesco.com/jp/ja/individual-investor/funds/featured-funds/global-best.html',holdings:[['3iグループ','英国','金融',4.7,'3I'],['AIAグループ','香港','金融',4.2,'AIA'],['カナディアン・パシフィック・カンザス・シティ','カナダ','資本財・サービス',4.1,'CPKC'],['マイクロソフト','米国','情報技術',4.0,'MSFT'],['ロールス・ロイス','英国','資本財・サービス',3.5,'RR'],['ビザ','米国','金融',3.4,'V'],['テキサス・インスツルメンツ','米国','情報技術',3.3,'TXN'],['メドライン','米国','ヘルスケア',3.2,'MDLN'],['コカ・コーラ・ユーロパシフィック','オランダ','生活必需品',2.9,'CCEP'],['スタンダードチャータード','英国','金融',2.6,'STAN']]},
{id:'wcm',name:'WCM世界成長株',full:'WCM世界成長株厳選ファンド（予想分配金提示型）',date:'2026-09-30',status:'参考値・要公式照合',basis:'ファンド上位10銘柄（第三者の月次資料抽出）',source:'https://www.alamco.co.jp/fund/WCM_es/index.html',holdings:[['シーメンス・エナジー','ドイツ','資本財',7.8,'ENR'],['ロールス・ロイス','英国','資本財',6.8,'RR'],['台湾セミコンダクター（TSMC）','台湾','半導体',5.6,'TSMC'],['サムスン電子','韓国','情報技術',4.9,'005930'],['コンフォート・システムズUSA','米国','資本財',4.6,'FIX'],['シー ADR','シンガポール','一般消費財',4.2,'SE'],['シャークニンジャ','米国','一般消費財',4.1,'SN'],['シーゲイト・テクノロジー','アイルランド','情報技術',3.9,'STX'],['テバ・ファーマシューティカル','イスラエル','ヘルスケア',3.9,'TEVA'],['メタ・プラットフォームズ','米国','コミュニケーション',3.9,'META']]},
{id:'the5g',name:'THE 5G（予想分配型）',full:'次世代通信関連 世界株式戦略ファンド（予想分配金提示型）',date:'2026-09-30',status:'運用会社の公式月報で確認',basis:'投資先ファンドの組入上位10銘柄（ファンド全体の構成比とは異なる）',source:'https://www.smtam.jp/fund/pdf/fundid_510182_20260930_m.pdf',holdings:[['アップル','米国','情報技術',5.26,'AAPL'],['エヌビディア','米国','情報技術',4.83,'NVDA'],['アマゾン','米国','一般消費財',4.72,'AMZN'],['台湾セミコンダクター（TSMC）','台湾','情報技術',4.12,'TSMC'],['マーベル・テクノロジー','米国','情報技術',3.76,'MRVL'],['SCREENホールディングス','日本','情報技術',3.10,'7735'],['古河電気工業','日本','資本財',3.07,'5801'],['村田製作所','日本','情報技術',2.97,'6981'],['メタ・プラットフォームズ','米国','コミュニケーション',2.77,'META'],['中際旭創','中国','情報技術',2.72,'300308']]},
{id:'563a',name:'563A（カバードコール）',full:'グローバルX NASDAQ100・デイリー・カバード・コール ETF',date:'',status:'投資先ETF・オプションの確認が必要',basis:'韓国ETFを通じた投資。NASDAQ100構成銘柄＝563A直接保有銘柄ではありません',source:'https://globalxetfs.co.jp/funds/563A/index.html',holdings:[]}
];
const storage='fund-insight-v01';let funds;try{const v=JSON.parse(localStorage.getItem(storage));funds=Array.isArray(v)&&v.length===4?v:structuredClone(base)}catch(e){funds=structuredClone(base)}let current='invesco',tab='funds';const $=q=>document.querySelector(q);const html=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const url=x=>/^https:\/\//.test(x||'')?x:'#';const fnum=n=>Number(n).toFixed(2).replace(/0+$/,'').replace(/\.$/,'');function persist(){try{localStorage.setItem(storage,JSON.stringify(funds))}catch(e){alert('保存に失敗しました。ブラウザの保存設定を確認してください。')}}const selectFund=id=>{current=id;render()};function group(arr,index){let out={};for(let h of arr)out[h[index]]=(out[h[index]]||0)+Number(h[3]);return Object.entries(out).sort((a,b)=>b[1]-a[1])}function panel(title,inside){return `<div class="card"><h3 style="margin:0 0 14px;font-size:16px">${title}</h3>${inside}</div>`}function bars(rows){const max=Math.max(...rows.map(r=>Number(r[1])),1);return rows.map(([name,val],i)=>`<div class="item"><div class="rank">${i+1}</div><div class="barbody"><div class="barlabel"><span title="${html(name)}">${html(name)}</span><b>${fnum(val)}%</b></div><div class="track"><div style="width:${Math.min(100,100*val/max)}%"></div></div></div></div>`).join('')}
function fundview(){const f=funds.find(x=>x.id===current);return `<p class="intro">銘柄・国・業種の構成比を見やすく表示。数字は各資料の基準日時点であり、リアルタイムではありません。</p><div class="cards">${funds.map(x=>`<button class="fund ${x.id===current?'active':''}" onclick="selectFund('${x.id}')"><b>${html(x.name)}</b><small>${x.date?html(x.date)+' 時点':'データ未登録'}</small><em>${x.holdings.length?'上位'+x.holdings.length+'銘柄':'登録待ち'}</em></button>`).join('')}</div><div class="card"><div class="headrow"><div><h2>${html(f.name)}</h2><div class="muted tiny">${html(f.full)}</div><p class="tiny" style="color:#e4d194;margin-bottom:5px">${html(f.status)}</p><div class="tiny muted">${f.date?'基準日：'+html(f.date):'基準日：未登録'}　｜　${html(f.basis)}</div></div><a href="${url(f.source)}" target="_blank" rel="noopener" class="button secondary" style="text-decoration:none">公式資料を開く ↗</a></div></div>${f.holdings.length?`<div class="grid">${panel('組入上位'+f.holdings.length+'銘柄',bars(f.holdings.map(h=>[h[0],h[3]])))}<div style="display:grid;gap:16px">${panel('上位銘柄内の国別構成',bars(group(f.holdings,1)))}${panel('上位銘柄内の業種別構成',bars(group(f.holdings,2)))}</div></div><div class="callout"><b>数値の読み方</b><br>国別・業種別の棒グラフは、掲載された上位10銘柄を合計したものです。ファンド全体の国別・業種別比率ではありません。${f.id==='the5g'?' THE 5Gは実際の投資先ファンドの保有株比率です。':''}</div>`:`<div class="card empty">組入詳細はまだ登録していません。${html(f.name)}の公式資料を開き、データ更新から登録できます。<div class="btnrow" style="justify-content:center"><button class="button" onclick="switchTab('edit')">データを登録</button></div></div>`}`}
function overlaps(){let keys={};for(let f of funds)for(let h of f.holdings){const key=h[4]||h[0];(keys[key]??=[]).push({name:h[0],fund:f.name,pct:h[3]})}let arr=Object.values(keys).filter(x=>x.length>1).sort((a,b)=>b.length-a.length);return `<p class="intro">組入上位10銘柄に同じ企業があるかを探します。なお、各ファンドの保有金額を加重した総合的な集中度は計算していません。</p><div class="card"><h2 style="margin:0 0 16px">共通している組入企業：${arr.length}社</h2><div class="overlap">${arr.length?arr.map(r=>`<div class="overlapcard"><b>${html(r[0].name)}</b>${r.map(x=>`<div class="mrow"><div>${html(x.fund)}</div><b>${fnum(x.pct)}%</b></div>`).join('')}</div>`).join(''):'<p class="muted">登録済みの上位銘柄に共通企業はありません。</p>'}</div></div><div class="callout">企業名の表記揺れをそろえるため、初期データには企業IDを設定しています。登録を増やした場合は入力された企業名・IDの一致を利用します。</div>`}
function editor(){const f=funds.find(x=>x.id===current);return `<p class="intro">月次レポートの内容を転記して更新します。自動収集はまだありません。入力内容はこの端末だけに保存されます。</p><div class="cards">${funds.map(x=>`<button class="fund ${x.id===current?'active':''}" onclick="selectFund('${x.id}')"><b>${html(x.name)}</b><small>${html(x.date||'データ未登録')}</small></button>`).join('')}</div><div class="card"><h2 style="margin:0 0 18px">${html(f.name)} を更新</h2><div class="formgrid"><div><label for="date">レポートの基準日</label><input id="date" type="date" value="${html(f.date)}"></div><div><label for="source">公式資料URL（https://）</label><input id="source" type="url" value="${html(f.source)}"></div><div class="full"><label for="basis">比率の基準・補足</label><input id="basis" value="${html(f.basis)}"></div><div class="full"><label for="entry">組入銘柄（1行1銘柄、カンマ区切り：銘柄名,国,業種,比率%,企業ID）</label><textarea id="entry" spellcheck="false">${html(f.holdings.map(h=>h.join(',')).join('\n'))}</textarea></div></div><div class="btnrow"><button class="button" onclick="saveEdit()">この内容で保存</button><button class="button secondary" onclick="downloadData()">全ファンドのJSONを保存</button><button class="button danger" onclick="resetData()">初期データへ戻す</button></div><div class="callout">例：アップル,米国,情報技術,5.26,AAPL<br>企業IDは他ファンドと重複を調べるための目印で、同じ企業には同じIDを使ってください。入力が不完全な場合は保存しません。</div></div>`}
function switchTab(v){tab=v;document.querySelectorAll('.nav button').forEach(b=>b.classList.toggle('active',b.dataset.tab===v));render()}function render(){$('#root').innerHTML=tab==='funds'?fundview():tab==='overlap'?overlaps():editor()}function saveEdit(){try{const f=funds.find(x=>x.id===current);const lines=$('#entry').value.split('\n').map(v=>v.trim()).filter(Boolean);const holdings=lines.map((line,i)=>{let p=line.split(',').map(v=>v.trim());if(p.length<4||p.length>5||!p[0]||!p[1]||!p[2]||!Number.isFinite(Number(p[3]))||Number(p[3])<0||Number(p[3])>100)throw new Error(`${i+1}行目の形式が正しくありません`);return[p[0],p[1],p[2],Number(p[3]),p[4]||p[0]]});if(holdings.length>200)throw new Error('最大200銘柄までです');const src=$('#source').value.trim();if(!/^https:\/\//.test(src))throw new Error('公式資料URLはhttps://で始めてください');const dt=$('#date').value;if(holdings.length&&!dt)throw new Error('基準日を入力してください');f.holdings=holdings;f.source=src;f.date=dt;f.basis=$('#basis').value.trim();f.status='ユーザーが編集したデータ（公式照合は自己確認）';persist();switchTab('funds')}catch(err){alert(err.message)}}function downloadData(){const blob=new Blob([JSON.stringify(funds,null,2)],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='fund-data.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),2000)}function resetData(){if(confirm('編集データをすべて消して初期状態に戻しますか？')){funds=structuredClone(base);persist();render()}}document.querySelectorAll('.nav button').forEach(b=>b.addEventListener('click',()=>switchTab(b.dataset.tab)));render();
</script></body></html>
