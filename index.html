function brokerSwitch(){return `<div class="seg narrow">${brokers.map(([v,l])=>`<button class="${ui.broker===v?'active':''}" onclick="changeBroker('${v}')">${l}</button>`).join('')}</div>`}
function donut(items,totalText,subtitle){const total=items.reduce((s,i)=>s+i.value,0);if(!total)return `<div class="empty"><div class="empty-emoji">◯</div><b>まだ登録データがありません</b><p class="subtext">スクショの読み取りか手入力で、円グラフが自動作成されます。</p><button class="btn secondary" onclick="go('import')">資産を登録する</button></div>`;
let offset=0;const cols=items.map((item,i)=>{const from=offset;offset+=item.value/total*100;return `${palette[i%palette.length]} ${from.toFixed(4)}% ${offset.toFixed(4)}%`}).join(',');return `<div class="donut-area"><div class="donut" style="background:conic-gradient(${cols})"><div class="donut-center"><span class="fine">${cleanHTML(subtitle||'合計')}</span><strong>${cleanHTML(totalText||yen(total))}</strong></div></div><div class="legend">${items.slice(0,9).map((x,i)=>`<div class="legend-line"><span class="legend-left"><i class="dot" style="background:${palette[i%palette.length]}"></i><span class="name">${cleanHTML(x.name)}</span></span><b>${pct(x.value/total*100)}</b></div>`).join('')}${items.length>9?`<div class="fine">ほか${items.length-9}項目は下の一覧で確認できます</div>`:''}</div></div>`}
function assetList(list){if(!list.length)return `<div class="empty"><div class="empty-emoji">▤</div><b>登録された資産はありません</b><p class="subtext">保有画面のスクショを取り込むと、ここにファンドごとの評価額を表示します。</p><button class="btn" onclick="go('import')">スクショから登録</button></div>`;
const total=hash(list);return list.slice().sort((a,b)=>b.value-a.value).map(a=>{const profit=a.cost===null||a.cost===''?null:a.value-a.cost;return `<div class="asset"><div class="asset-main"><div class="asset-icon">${cleanHTML((fundName(a)||'投').slice(0,1))}</div><div class="asset-info"><div class="asset-title">${cleanHTML(fundName(a))}</div><div class="asset-foot">${a.broker==='rakuten'?'楽天':'松井'} ｜ ${a.bucket==='nisa'?'NISA':a.bucket==='income'?'高分配':'その他'}${a.updated?' ｜ '+cleanHTML(a.updated):''}</div></div><div class="asset-val"><b>${yen(a.value)}</b><div class="fine ${profit===null?'':profit>=0?'positive':'negative'}">${profit===null?'損益未登録':signYen(profit)}</div></div></div><div class="row" style="margin-top:8px;padding-left:51px"><div class="fine">構成比 ${total?pct(a.value/total*100):'—'}</div><div class="actions"><button class="linklike" onclick="showFund('${cleanHTML(a.fundId)}')">中身</button><button class="linklike" onclick="assetForm('${cleanHTML(a.id)}')">編集</button><button class="linklike" style="color:#b35c54" onclick="removeAsset('${cleanHTML(a.id)}')">削除</button></div></div></div>`}).join('')}
function home(){const arr=scopedAssets(),summ=summarize(arr),group=groupFunds(arr);return `<div class="section-title" style="margin-top:0">マイポートフォリオ</div>${bucketSwitch()}${brokerSwitch()}<section class="card hero"><div class="eyebrow">${cleanHTML(buckets.find(x=>x[0]===ui.bucket)?.[1]||'全体')}の資産評価額</div><div class="big-number">${yen(summ.value)}</div><div class="row"><div><div class="fine">評価損益${!summ.complete?'（登録のある分のみ）':''}</div><b class="${summ.profit>=0?'positive':'negative'}" style="font-size:20px">${summ.knownValue?signYen(summ.profit):'—'}</b></div><div style="text-align:right"><div class="fine">損益率</div><b class="${summ.profit>=0?'positive':'negative'}" style="font-size:20px">${summ.cost?pct(summ.profit/summ.cost*100):'—'}</b></div></div><div class="divider"></div><div class="row"><span class="fine">${arr.length}件の保有情報 ｜ ${group.length}商品</span><button class="btn secondary small" onclick="addSnapshot()">今日の残高を記録</button></div></section><div class="grid-2"><div class="metric"><div class="label">NISA</div><b>${yen(hash(state.assets.filter(a=>a.bucket==='nisa'&&(ui.broker==='all'||a.broker===ui.broker))))}</b></div><div class="metric"><div class="label">高分配</div><b>${yen(hash(state.assets.filter(a=>a.bucket==='income'&&(ui.broker==='all'||a.broker===ui.broker))))}</b></div></div><h2 class="section-title">商品別の資産構成</h2><section class="card">${donut(group,'',group.length+'商品')}<div class="info">投信・ETFを1本ずつ分けて表示。楽天と松井で同じファンドを持っている場合は合算されます。</div></section><div class="row" style="margin:22px 0 5px"><h2 class="section-title" style="margin:0">保有銘柄一覧</h2><button class="btn small" onclick="assetForm()">＋ 手入力</button></div><section class="card" style="padding-top:4px">${assetList(arr)}</section>${snapshotSection()}</div>`;}
function snapshotSection(){const data=state.snapshots.filter(s=>s.bucket===ui.bucket&&s.broker===ui.broker).slice(-12);return `<h2 class="section-title">資産推移</h2><section class="card">${data.length<2?`<div class="empty"><b>資産推移はまだありません</b><p class="subtext">資産を登録して「今日の残高を記録」を2回以上実行すると推移を見られます。記録日の残高として保存します。</p></div>`:sparkline(data)}<div class="fine">記録した時点の金額を表示。証券会社から過去の残高を自動取得する機能はありません。</div></section>`;}
function sparkline(data){const W=340,H=125,values=data.map(d=>d.value),min=Math.min(...values),max=Math.max(...values),range=Math.max(max-min,1),coords=data.map((d,i)=>[14+i*(W-28)/(data.length-1),H-18-(d.value-min)/range*(H-40)]);return `<svg viewBox="0 0 340 140" style="width:100%;height:auto"><line x1="14" y1="112" x2="326" y2="112" stroke="#e1e9e4"/><polyline points="${coords.map(([x,y])=>x+','+y).join(' ')}" stroke="#168c74" stroke-width="3" fill="none" stroke-linejoin="round" stroke-linecap="round"/>${coords.map(([x,y])=>`<circle cx="${x}" cy="${y}" r="3.5" fill="#168c74"/>`).join('')}<text x="12" y="133" font-size="10" fill="#768780">${cleanHTML(data[0].date)}</text><text x="326" y="133" text-anchor="end" font-size="10" fill="#768780">${cleanHTML(data[data.length-1].date)}</text></svg><div class="row"><div><div class="fine">最初の記録</div><b>${yen(values[0])}</b></div><div style="text-align:right"><div class="fine">最新の記録</div><b>${yen(values[values.length-1])}</b></div></div>`}
function addSnapshot(){const arr=scopedAssets();if(!arr.length){alert('先に資産を登録してください');return;}const date=new Date().toLocaleDateString('sv-SE');state.snapshots=state.snapshots.filter(s=>!(s.date===date&&s.bucket===ui.bucket&&s.broker===ui.broker));state.snapshots.push({date,bucket:ui.bucket,broker:ui.broker,value:hash(arr)});state.snapshots.sort((a,b)=>a.date.localeCompare(b.date));persist();render();}
function exposureData(mode,arr){const sums=new Map();let known=0;for(const a of arr){const f=fund(a.fundId),h=f?.holdings||[];const valid=h.filter(x=>Array.isArray(x)&&Number(x[3])>0);for(const row of valid){const p=Math.min(100,Number(row[3]))/100;const val=a.value*p;known+=val;const label=mode==='company'?row[0]:mode==='country'?row[1]:row[2];const key=mode==='company'?(row[4]||row[0]):label;const prev=sums.get(key)||{name:label,value:0,from:new Set()};prev.value+=val;prev.from.add(f.name);sums.set(key,prev)}}return{items:[...sums.values()].sort((a,b)=>b.value-a.value),known,all:hash(arr)}}
function rankedRows(items,denom,kind){const max=Math.max(1,...items.map(x=>x.value));return items.slice(0,40).map((x,i)=>`<div class="exposure"><div class="exposure-head"><div style="min-width:0;flex:1"><b>${i+1}. ${cleanHTML(x.name)}</b>${kind==='company'?`<div class="fine">${cleanHTML([...x.from].join('・'))}</div>`:''}</div><div style="text-align:right;white-space:nowrap"><b>${yen(x.value)}</b><div class="fine">${denom?pct(x.value/denom*100):'—'}</div></div></div><div class="track"><div style="width:${x.value/max*100}%"></div></div></div>`).join('')}
function analysis(){const arr=scopedAssets(),g=groupFunds(arr),result=exposureData(ui.analysis,arr);return `<h2 class="section-title" style="margin-top:0">投資先の中身</h2>${bucketSwitch()}${brokerSwitch()}<section class="card"><div class="row"><b>保有ファンドを通した投資先</b><span class="tag orange">参考推計</span></div><p class="subtext" style="margin-bottom:14px">公開されている上位組入銘柄と登録した評価額から、投資先の重なりを見える化します。</p><div class="seg">${[['company','企業'],['country','国・地域'],['sector','業種']].map(([v,l])=>`<button class="${ui.analysis===v?'active':''}" onclick="changeAnalysis('${v}')">${l}</button>`).join('')}</div>${result.items.length?`<div class="grid-2"><div class="metric"><div class="label">掲載銘柄から推計できた部分</div><b>${yen(result.known)}</b></div><div class="metric"><div class="label">データ未掲載・未登録等</div><b>${yen(Math.max(0,result.all-result.known))}</b></div></div>${rankedRows(result.items,result.all,ui.analysis)}<div class="chart-note">比率の分母は選択中の資産全体の評価額。公表されている上位銘柄のみを使用した参考推計で、全組入銘柄ではありません。THE 5Gなど投資先ファンドの比率を使う商品の数値は、実際の直接保有額を示しません。公式資料との照合未了データも含みます。</div>`:`<div class="empty"><b>分析用の保有データがありません</b><p class="subtext">資産の登録後、組入情報があるファンドについて表示します。</p><button class="btn secondary" onclick="go('import')">登録する</button></div>`}</section><h2 class="section-title">ファンドごとの組入情報</h2><section class="card"><div class="fine" style="margin-bottom:12px">それぞれの上位銘柄、資料の日付、出典を確認できます。</div>${g.length?g.map(x=>fundTile(x.id,x.name)).join(''):state.funds.filter(x=>['invesco','wcm','the5g','563a','sp500','allcountry'].includes(x.id)).map(x=>fundTile(x.id,x.name)).join('')}</section>`;}
function fundTile(id,name){const f=fund(id);return `<button style="width:100%;display:flex;justify-content:space-between;text-align:left;align-items:center;border:none;border-top:1px solid var(--line);background:white;padding:14px 0;gap:9px" onclick="showFund('${cleanHTML(id)}')"><span><b style="font-size:14px">${cleanHTML(name)}</b><span style="display:block;font-size:11px;color:var(--sub);margin-top:6px">${f?.holdings?.length||0}銘柄掲載 ｜ ${cleanHTML(f?.date||'未登録')}</span></span><span style="color:var(--accent)">詳細を見る ›</span></button>`}
function distributions(){const list=state.dividends.filter(d=>d.date.startsWith(String(ui.year))&&(ui.bucket==='all'||d.bucket===ui.bucket)&&(ui.broker==='all'||d.broker===ui.broker)).sort((a,b)=>b.date.localeCompare(a.date));const total=list.reduce((s,x)=>s+x.amount,0),recv=list.filter(x=>x.mode==='receive').reduce((s,x)=>s+x.amount,0),reinvest=total-recv;const chart=Array.from({length:12},(_,i)=>{const rows=list.filter(d=>Number(d.date.slice(5,7))===i+1);return{month:i+1,ordinary:rows.filter(d=>d.kind==='ordinary').reduce((s,d)=>s+d.amount,0),special:rows.filter(d=>d.kind==='special').reduce((s,d)=>s+d.amount,0),unknown:rows.filter(d=>d.kind==='unknown').reduce((s,d)=>s+d.amount,0)}});const mx=Math.max(...chart.map(r=>r.ordinary+r.special+r.unknown),1);return `<h2 class="section-title" style="margin-top:0">配当・分配金</h2>${bucketSwitch()}${brokerSwitch()}<section class="card hero"><div class="row"><div><div class="eyebrow">${ui.year}年の分配金合計</div><div class="big-number">${yen(total)}</div></div><select aria-label="集計年" style="width:105px;padding:8px;border:1px solid var(--line);border-radius:10px;background:white" onchange="changeYear(this.value)">${Array.from({length:7},(_,i)=>new Date().getFullYear()-i).map(y=>`<option value="${y}" ${ui.year===y?'selected':''}>${y}年</option>`).join('')}</select></div><div class="grid-2"><div><div class="fine">受取</div><b>${yen(recv)}</b></div><div><div class="fine">再投資</div><b>${yen(reinvest)}</b></div></div></section><section class="card"><div class="row"><b>月ごとの分配金</b><span class="fine">円</span></div><div class="month-chart">${chart.map(m=>`<div class="month-unit"><div class="month-col"><span style="height:${m.unknown/mx*100}%;background:#a2b1a9"></span><span style="height:${m.special/mx*100}%;background:#edaa58"></span><span style="height:${m.ordinary/mx*100}%;background:#32ad8f"></span></div><small>${m.month}月</small></div>`).join('')}</div><div class="month-legend"><span><i class="dot" style="background:#32ad8f"></i> 普通分配</span><span><i class="dot" style="background:#edaa58"></i> 特別分配</span><span><i class="dot" style="background:#a2b1a9"></i> 不明</span></div><div class="info">特別分配金は元本払戻金です。受け取った金額と運用益を混同しないよう種類を分けて記録します。</div></section><div class="row"><h2 class="section-title">分配金の記録</h2><button class="btn small" onclick="divForm()">＋ 追加</button></div><section class="card">${list.length?list.map(x=>`<div class="distro-row"><div><b>${cleanHTML(fund(x.fundId)?.name||x.name||'未登録商品')}</b><div class="fine">${cleanHTML(x.date)} ｜ ${x.broker==='rakuten'?'楽天':'松井'} ｜ ${x.kind==='ordinary'?'普通':x.kind==='special'?'特別':'不明'} ｜ ${x.mode==='receive'?'受取':'再投資'}</div></div><div style="text-align:right"><b>${yen(x.amount)}</b><div class="actions"><button class="linklike" onclick="divForm('${cleanHTML(x.id)}')">編集</button><button class="linklike" style="color:#b55b55" onclick="removeDiv('${cleanHTML(x.id)}')">削除</button></div></div></div>`).join(''):`<div class="empty"><b>まだ分配金の記録はありません</b><p class="subtext">普通・特別、受取・再投資を分けて管理できます。</p><button class="btn secondary" onclick="divForm()">分配金を登録</button></div>`}</section>`;}
function imports(){return `<h2 class="section-title" style="margin-top:0">スクショから登録</h2><section class="card"><div class="row"><b>① 取り込む口座を選択</b><span class="tag">端末内で解析</span></div><div class="form2"><div class="field"><label for="import-broker">証券口座</label><select id="import-broker" onchange="ui.importBroker=this.value">${opts(brokers.filter(x=>x[0]!=='all'),ui.importBroker)}</select></div><div class="field"><label for="import-bucket">資産の種類</label><select id="import-bucket" onchange="ui.importBucket=this.value">${opts(buckets.filter(x=>x[0]!=='all'),ui.importBucket)}</select></div></div><div class="divider"></div><b>② 証券会社のスクショを選択</b><div class="field"><label for="ocr-file">松井証券・楽天証券の保有画面（複数可）</label><input id="ocr-file" type="file" accept="image/*" multiple onchange="readImages(event)"></div><div class="info">画像はアプリ内で文字認識し、サーバーにアップロードしません。読取結果には誤りがあり得ます。口座・分類・評価額・取得額は保存前に確認してください。</div>${ui.ocrPreviews.length?`<div class="field"><b>元のスクショを見ながら確認</b><p class="fine">画像をタップすると大きく表示します。元画像はページを閉じると破棄されます。</p><div class="ocr-thumbs">${ui.ocrPreviews.map((x,i)=>`<button class="ocr-thumb" onclick="showPreview(${i})"><img src="${x}" alt="取り込んだスクショ ${i+1}"><small>画像 ${i+1} を拡大</small></button>`).join('')}</div></div>`:''}${ui.ocrNote?`<div class="alert">${cleanHTML(ui.ocrNote)}</div>`:''}<div id="ocr-area"></div></section><section class="card"><b>読み取った文字を手動で修正・再解析</b><div class="field"><label for="ocr-raw">認識したテキスト</label><textarea id="ocr-raw" style="min-height:140px" placeholder="スクショを選ぶと解析テキストが入ります。必要なら修正できます。">${cleanHTML(ui.ocrText)}</textarea></div><div class="actions"><button class="btn secondary" onclick="parseFromText()">テキストから候補を探す</button><button class="btn outline" onclick="assetForm()">手入力で登録</button></div><p class="fine">投資信託名が認識できない場合や評価額を抽出できない場合は、手入力を使ってください。OCRの結果だけで自動保存しません。</p></section><section class="card"><b>③ 登録する内容を確認</b>${candidateUI()}</section>`;}

function settings(){return `<h2 class="section-title" style="margin-top:0">設定・データ管理</h2><section class="card"><b>資産の登録とバックアップ</b><p class="subtext">資産・分配金・組入情報は、この端末のブラウザ領域に保存されます。GitHubの公開ファイルには書き込みません。</p><div class="actions"><button class="btn" onclick="assetForm()">資産を追加</button><button class="btn secondary" onclick="exportData()">バックアップ保存</button></div><div class="field"><label for="backup-file">バックアップから復元（JSONファイル）</label><input type="file" accept=".json,application/json" id="backup-file" onchange="importData(event)"></div><div class="alert">端末の買い替えやSafariのデータ削除で保存情報が失われる場合があります。時々バックアップをダウンロードしてください。バックアップには資産額が含まれるため、取り扱いに注意してください。</div></section><section class="card"><b>組入情報を編集する</b><p class="subtext">上位銘柄と比率を、月次レポートに合わせて手動で編集できます。公式資料の自動取り込みは未実装です。</p><div class="field"><label for="editfund">編集する投信・ETF</label><select id="editfund">${opts(state.funds.map(f=>[f.id,f.name]),state.funds[0].id)}</select></div><div class="actions"><button class="btn secondary" onclick="editFund($('#editfund').value)">組入銘柄を編集</button><button class="btn outline" onclick="addFund()">商品を追加</button></div></section><section class="card"><b>登録済みデータ</b><div class="grid-2" style="margin:12px 0"><div class="metric"><div class="label">保有明細</div><b>${state.assets.length}件</b></div><div class="metric"><div class="label">分配金の記録</div><b>${state.dividends.length}件</b></div></div><div class="actions"><button class="btn danger small" onclick="clearAssets()">資産と分配金を全削除</button></div></section><section class="card"><b>データの注意点</b><p class="subtext">初期のインベスコ・WCMには第三者資料由来の未照合値が含まれます。THE 5Gの掲載割合は投資先ファンドの割合であり、当該投信全体の割合とは異なります。563Aの中身は投資先ETFとオプションを含めて別途確認が必要です。NISAのS&P500・オルカンの組入データは未登録です。</p><p class="subtext">計算した「企業別・国別・業種別の金額」は掲載銘柄に基づく参考推計であり、正確な実質投資額とは限りません。投資判断には運用会社の公式資料を確認してください。</p></section>`;}

const aliases=[['invesco',/インベスコ|世界厳選株式|世界厳選/i],['wcm',/WCM|世界成長株/i],['the5g',/次世代通信関連|THE\s*5G|5G\s*\(?予想/i],['563a',/563A|NASDAQ\s*100.{0,10}カバード/i],['435a',/435A/i],['divdevelop',/先進国.{0,9}好配当/i],['sp500',/S\s*&\s*P\s*500|S&P500|米国株式.{0,12}500/i],['allcountry',/オール.?カントリー|オルカン|全世界株式/i],['bull43',/4[.．]3\s*倍|日本株4[.．]3/i]];

// 画面表示のラベルと数字を結びつける。カンマがピリオドと認識されるOCRにも対応。
function numberTokens(line){
  const t=String(line||'').normalize('NFKC').replace(/[−ー―–]/g,'-').replace(/[，、]/g,',').replace(/(?<=\d)\s+(?=\d{3}(?:\D|$))/g,',');
  const re=/(?:[+\-]\s*)?(?:\d{1,3}(?:[,.]\s*\d{3})+|\d{4,12})(?![\d.,])/g;
  return [...t.matchAll(re)].map(m=>({v:Number(m[0].replace(/[\s,.]/g,'')),raw:m[0],pos:m.index})).filter(x=>Number.isFinite(x.v));
}
function labelValue(block,kind){
  const rules={value:/時価\s*評価額|投信\s*評価額|評価額(?:合計)?|評価\s*金額|評価\s*残高|時価\s*総額/i,
    profit:/評価\s*損益|含み\s*損益|損益\s*額/i,
    cost:/取得\s*総額|取得\s*金額|取得\s*額|買付\s*金額/i};
  const allLabels=/(?:時価\s*評価額|投信\s*評価額|評価\s*損益|取得\s*総額|取得\s*金額|基準\s*価額|平均\s*取得|保有\s*数量|トータル\s*リターン|分配\s*金)/i;
  for(let i=0;i<block.length;i++){
    const line=String(block[i]).normalize('NFKC');const match=line.match(rules[kind]);if(!match)continue;
    let rest=line.slice(match.index+match[0].length);let nums=numberTokens(rest);
    // 数字が別行にあるOCRに対応。ただし別の項目に跨がない。
    for(let look=1;!nums.length&&look<=2&&i+look<block.length;look++){
      const next=String(block[i+look]).normalize('NFKC');
      if(allLabels.test(next))break;
      nums=numberTokens(next);
    }
    if(nums.length){const n=nums[0].v;if(kind==='value'||kind==='cost'){if(n>0)return n}else return n;}
  }
  return null;
}
function inferBroker(raw,defaultBroker){if(/member\.rakuten-sec\.co\.jp|rakuten-sec|楽天証券|楽天証券株式会社|保有\s*商品\s*詳細|NISAつみたて投資枠/i.test(raw))return'rakuten';if(/matsui|松井証券|残高照会|投信評価額合計/i.test(raw))return'matsui';return defaultBroker;}
function inferBucket(raw,defaultBucket){if(/NISA\s*(つみたて|成長|口座)|つみたて投資枠|成長投資枠/i.test(raw))return'nisa';return defaultBucket;}
function bestRecognizedName(text,id){
  const raw=String(text||'').normalize('NFKC').replace(/\s+/g,' ').trim();
  if(id==='sp500'&&/eMAXIS|米国株式/.test(raw))return'eMAXIS Slim 米国株式（S&P500）';
  if(id==='allcountry'&&/eMAXIS|全世界株式/.test(raw))return'eMAXIS Slim 全世界株式（オール・カントリー）';

function candidateFromText(text,settings={}){
 const raw=String(text||'');
 const lines=raw.replace(/\r/g,'').split('\n').map(x=>x.trim()).filter(Boolean);
 const broker=inferBroker(raw,settings.broker||ui.importBroker),bucket=inferBucket(raw,settings.bucket||ui.importBucket);
 const found=[];
 for(let i=0;i<lines.length;i++){
   const pair=lines[i]+' '+(lines[i+1]||'');
   const id=identify(lines[i])||identify(pair);if(!id)continue;
   if(found.some(x=>x.fundId===id))continue;
   const block=[];
   // 楽天の個別画面と松井の保有銘柄一覧の両方を読む
   for(let j=i;j<Math.min(lines.length,i+23);j++){
     const nextId=j>i?identify(lines[j]):'';
     if(nextId&&nextId!==id)break;
     block.push(lines[j]);
   }
   const value=labelValue(block,'value');
   const profit=labelValue(block,'profit');
   const rawCost=labelValue(block,'cost');
   const cost=rawCost!==null?rawCost:value!==null&&profit!==null?value-profit:null;
   let detail=value!==null?'評価額はOCRから取得。':'評価額が読めませんでした。スクショを見て入力してください。';
   if(cost!==null&&cost>=0)detail+=' 取得額も取得済み（要確認）。';
   const nm=bestRecognizedName(pair,id);
   found.push({fundId:id,name:nm,broker,bucket,value:value??'',cost:cost!==null&&cost>=0?cost:'',include:value!==null,origin:detail});
 }
 return found;
}
function mergeCandidates(items){const map=new Map();for(const x of items){const k=[x.fundId,x.broker,x.bucket].join('|');if(!map.has(k)){map.set(k,x);continue}const prev=map.get(k),p=prev.value!==''?1:0,n=x.value!==''?1:0;if(n>p||n===p&&x.cost!==''&&prev.cost==='')map.set(k,x)}return [...map.values()]}
function parseFromText(){ui.ocrText=$('#ocr-raw').value;ui.candidates=candidateFromText(ui.ocrText);if(!ui.candidates.length)alert('銘柄名を特定できませんでした。下の「手入力で登録」から登録できます。');render();}
function setOCRProgress(p,label){ui.ocrPct=Math.round(p||0);ui.ocrStatus=label;const el=$('#ocr-area');if(el)el.innerHTML=`<div class="loader"><b>${cleanHTML(label)}</b><div class="progress"><div style="width:${Math.max(5,Math.min(100,ui.ocrPct))}%"></div></div><div class="fine">${ui.ocrPct}%</div></div>`}
async function getTesseract(){if(window.Tesseract)return window.Tesseract;return new Promise((resolve,reject)=>{const s=document.createElement('script');s.src='https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js';s.onload=()=>window.Tesseract?resolve(window.Tesseract):reject(Error('OCRライブラリが見つかりません'));s.onerror=()=>reject(Error('OCRライブラリを読み込めませんでした。通信状態を確認してください'));document.head.appendChild(s)})}
async function prepareImage(file,region){const u=URL.createObjectURL(file);try{const image=new Image();await new Promise((res,rej)=>{image.onload=res;image.onerror=rej;image.src=u});let x=0,y=0,w=image.naturalWidth,h=image.naturalHeight;if(region){y=Math.floor(h*region[0]);h=Math.floor(h*(region[1]-region[0]));}
 const ratio=Math.min(1.3,2900/Math.max(w,h));const cv=document.createElement('canvas');cv.width=Math.max(1,Math.round(w*ratio));cv.height=Math.max(1,Math.round(h*ratio));cv.getContext('2d',{willReadFrequently:true}).drawImage(image,x,y,w,h,0,0,cv.width,cv.height);return cv.toDataURL('image/png');}finally{URL.revokeObjectURL(u)}}
async function previewFile(file){const u=URL.createObjectURL(file);try{const im=new Image();await new Promise((res,rej)=>{im.onload=res;im.onerror=rej;im.src=u});const ratio=Math.min(1,1500/Math.max(im.naturalWidth,im.naturalHeight));const c=document.createElement('canvas');c.width=Math.max(1,Math.floor(im.naturalWidth*ratio));c.height=Math.max(1,Math.floor(im.naturalHeight*ratio));c.getContext('2d').drawImage(im,0,0,c.width,c.height);return c.toDataURL('image/jpeg',.83);}finally{URL.revokeObjectURL(u)}}
function showPreview(i){const src=ui.ocrPreviews[i];if(!src)return;showModal('元画像 '+(i+1),`<img class="preview-image" alt="OCRの元画像" src="${src}"><p class="fine">元画像と候補欄を見比べて、金額を確認してください。</p>`)}
async function readImages(ev){
 const files=Array.from(ev.target.files||[]);if(!files.length)return;
 if(files.length>8){alert('一度に8枚まで選択してください');return;}
 ui.importBroker=$('#import-broker').value;ui.importBucket=$('#import-bucket').value;
 ui.ocrText='';ui.candidates=[];ui.ocrPreviews=[];ui.ocrNote='';ui.ocrBusy=true;
 let worker;
 try{
  setOCRProgress(5,'画像のプレビューを準備しています');
  for(const f of files)ui.ocrPreviews.push(await previewFile(f));
  setOCRProgress(10,'日本語の文字認識を準備しています');
  const Tess=await getTesseract();worker=await Tess.createWorker('jpn+eng',1,{logger:m=>{if(m.status==='recognizing text')setOCRProgress(15+(m.progress||0)*70/files.length,'画像の文字を読み取っています')}});
  const chunks=[],items=[];
  for(let i=0;i<files.length;i++){
    setOCRProgress(15+i/files.length*75,`画像 ${i+1}/${files.length} を解析中`);
    const f=files[i],src=await prepareImage(f);
    const raw=(await worker.recognize(src)).data.text||'';
    let text=raw;let detected=candidateFromText(text,{broker:ui.importBroker,bucket:ui.importBucket});
    if(!detected.length||detected.some(x=>x.value==='')){
      // 上下のブラウザUIやナビを除いた領域を高解像度で再認識
      setOCRProgress(25+i/files.length*70,`画像 ${i+1}/${files.length} の金額欄を再確認中`);
      try{
        await worker.setParameters({tessedit_pageseg_mode:'6'});
        const crop=await prepareImage(f,[.12,.82]);
        const extra=(await worker.recognize(crop)).data.text||'';
        text+='\n'+extra;
        detected=mergeCandidates([...detected,...candidateFromText(extra,{broker:ui.importBroker,bucket:ui.importBucket})]);
        await worker.setParameters({tessedit_pageseg_mode:'3'});
      }catch(e){/* 再解析できなくても一次結果を残す */}
    }
    chunks.push('【画像 '+(i+1)+'】\n'+text);items.push(...detected);
  }
  ui.ocrText=chunks.join('\n\n');ui.candidates=mergeCandidates(items);
  const complete=ui.candidates.filter(x=>x.value!=='').length;
  ui.ocrNote=ui.candidates.length?`${ui.candidates.length}件の候補、うち金額の読取成功は${complete}件。元のスクショで金額と分類を確認して登録してください。`: '商品名・金額の自動特定ができませんでした。元のスクショを表示しながら、手入力で登録してください。';
  setOCRProgress(100,'文字認識が完了しました');
 }catch(e){ui.ocrNote='文字認識でエラーが発生しました。元のスクショを見ながら手入力できます。詳細: '+e.message;}
 finally{if(worker)try{await worker.terminate()}catch(_){}ui.ocrBusy=false;render();}
}
function saveCandidates(){let count=0;for(const row of $$('#candidate-list .candidate')){if(!row.querySelector('.cand-keep').checked)continue;const fundId=row.querySelector('.cand-fund').value,name=row.querySelector('.cand-name').value.trim()||fund(fundId)?.name||'';const valEl=row.querySelector('.cand-value'),value=Number(valEl.value),costEl=row.querySelector('.cand-cost'),cost=costEl.value.trim()===''?null:Number(costEl.value);if(!name||valEl.value===''||!Number.isFinite(value)||value<0||cost!==null&&(!Number.isFinite(cost)||cost<0)){alert('登録する候補の商品名・評価額・取得額を確認してください');return}const broker=row.querySelector('.cand-broker').value,bucket=row.querySelector('.cand-bucket').value;const existing=state.assets.find(a=>a.fundId===fundId&&a.broker===broker&&a.bucket===bucket&&(fundId!=='custom'||a.name===name));const a={id:existing?.id||uid(),fundId,name,value,cost,broker,bucket,units:existing?.units??null,updated:new Date().toLocaleDateString('sv-SE')};if(existing)Object.assign(existing,a);else state.assets.push(a);count++}if(!count){alert('登録する候補にチェックを入れてください');return}persist();ui.candidates=[];ui.ocrText='';go('home');alert(count+'件を保存しました。金額・口座の表示を確認してください。')}
render();
</script>
