function exposureData(mode,arr){const sums=new Map();let known=0;for(const a of arr){const f=fund(a.fundId),h=f?.holdings||[];const valid=h.filter(x=>Array.isArray(x)&&Number(x[3])>0);for(const row of valid){const p=Math.min(100,Number(row[3]))/100;const val=a.value*p;known+=val;const label=mode==='company'?row[0]:mode==='country'?row[1]:row[2];const key=mode==='company'?(row[4]||row[0]):label;const prev=sums.get(key)||{name:label,value:0,from:new Set()};prev.value+=val;prev.from.add(f.name);sums.set(key,prev)}}return{items:[...sums.values()].sort((a,b)=>b.value-a.value),known,all:hash(arr)}}
function rankedRows(items,denom,kind){const max=Math.max(1,...items.map(x=>x.value));return items.slice(0,40).map((x,i)=>`<div class="exposure"><div class="exposure-head"><div style="min-width:0;flex:1"><b>${i+1}. ${cleanHTML(x.name)}</b>${kind==='company'?`<div class="fine">${cleanHTML([...x.from].join('・'))}</div>`:''}</div><div style="text-align:right;white-space:nowrap"><b>${yen(x.value)}</b><div class="fine">${denom?pct(x.value/denom*100):'—'}</div></div></div><div class="track"><div style="width:${x.value/max*100}%"></div></div></div>`).join('')}
function analysis(){const arr=scopedAssets(),g=groupFunds(arr),result=exposureData(ui.analysis,arr);return `<h2 class="section-title" style="margin-top:0">投資先の中身</h2>${bucketSwitch()}${brokerSwitch()}<section class="card"><div class="row"><b>保有ファンドを通した投資先</b><span class="tag orange">参考推計</span></div><p class="subtext" style="margin-bottom:14px">公開されている上位組入銘柄と登録した評価額から、投資先の重なりを見える化します。</p><div class="seg">${[['company','企業'],['country','国・地域'],['sector','業種']].map(([v,l])=>`<button class="${ui.analysis===v?'active':''}" onclick="changeAnalysis('${v}')">${l}</button>`).join('')}</div>${result.items.length?`<div class="grid-2"><div class="metric"><div class="label">掲載銘柄から推計できた部分</div><b>${yen(result.known)}</b></div><div class="metric"><div class="label">データ未掲載・未登録等</div><b>${yen(Math.max(0,result.all-result.known))}</b></div></div>${rankedRows(result.items,result.all,ui.analysis)}<div class="chart-note">比率の分母は選択中の資産全体の評価額。公表されている上位銘柄のみを使用した参考推計で、全組入銘柄ではありません。THE 5Gなど投資先ファンドの比率を使う商品の数値は、実際の直接保有額を示しません。公式資料との照合未了データも含みます。</div>`:`<div class="empty"><b>分析用の保有データがありません</b><p class="subtext">資産の登録後、組入情報があるファンドについて表示します。</p><button class="btn secondary" onclick="go('import')">登録する</button></div>`}</section><h2 class="section-title">ファンドごとの組入情報</h2><section class="card"><div class="fine" style="margin-bottom:12px">それぞれの上位銘柄、資料の日付、出典を確認できます。</div>${g.length?g.map(x=>fundTile(x.id,x.name)).join(''):state.funds.filter(x=>['invesco','wcm','the5g','563a','sp500','allcountry'].includes(x.id)).map(x=>fundTile(x.id,x.name)).join('')}</section>`;}
function fundTile(id,name){const f=fund(id);return `<button style="width:100%;display:flex;justify-content:space-between;text-align:left;align-items:center;border:none;border-top:1px solid var(--line);background:white;padding:14px 0;gap:9px" onclick="showFund('${cleanHTML(id)}')"><span><b style="font-size:14px">${cleanHTML(name)}</b><span style="display:block;font-size:11px;color:var(--sub);margin-top:6px">${f?.holdings?.length||0}銘柄掲載 ｜ ${cleanHTML(f?.date||'未登録')}</span></span><span style="color:var(--accent)">詳細を見る ›</span></button>`}
function distributions(){const list=state.dividends.filter(d=>d.date.startsWith(String(ui.year))&&(ui.bucket==='all'||d.bucket===ui.bucket)&&(ui.broker==='all'||d.broker===ui.broker)).sort((a,b)=>b.date.localeCompare(a.date));const total=list.reduce((s,x)=>s+x.amount,0),recv=list.filter(x=>x.mode==='receive').reduce((s,x)=>s+x.amount,0),reinvest=total-recv;const chart=Array.from({length:12},(_,i)=>{const rows=list.filter(d=>Number(d.date.slice(5,7))===i+1);return{month:i+1,ordinary:rows.filter(d=>d.kind==='ordinary').reduce((s,d)=>s+d.amount,0),special:rows.filter(d=>d.kind==='special').reduce((s,d)=>s+d.amount,0),unknown:rows.filter(d=>d.kind==='unknown').reduce((s,d)=>s+d.amount,0)}});const mx=Math.max(...chart.map(r=>r.ordinary+r.special+r.unknown),1);return `<h2 class="section-title" style="margin-top:0">配当・分配金</h2>${bucketSwitch()}${brokerSwitch()}<section class="card hero"><div class="row"><div><div class="eyebrow">${ui.year}年の分配金・再投資の記録額</div><div class="big-number">${yen(total)}</div></div><select aria-label="集計年" style="width:105px;padding:8px;border:1px solid var(--line);border-radius:10px;background:white" onchange="changeYear(this.value)">${Array.from({length:7},(_,i)=>new Date().getFullYear()-i).map(y=>`<option value="${y}" ${ui.year===y?'selected':''}>${y}年</option>`).join('')}</select></div><div class="grid-2"><div><div class="fine">受取</div><b>${yen(recv)}</b></div><div><div class="fine">再投資</div><b>${yen(reinvest)}</b></div></div></section><section class="card"><div class="row"><b>月ごとの分配金</b><span class="fine">円</span></div><div class="month-chart">${chart.map(m=>`<div class="month-unit"><div class="month-col"><span style="height:${m.unknown/mx*100}%;background:#a2b1a9"></span><span style="height:${m.special/mx*100}%;background:#edaa58"></span><span style="height:${m.ordinary/mx*100}%;background:#32ad8f"></span></div><small>${m.month}月</small></div>`).join('')}</div><div class="month-legend"><span><i class="dot" style="background:#32ad8f"></i> 普通分配</span><span><i class="dot" style="background:#edaa58"></i> 特別分配</span><span><i class="dot" style="background:#a2b1a9"></i> 不明</span></div><div class="info">特別分配金は元本払戻金です。再投資の取引金額は現金の受取額に含めません。松井証券の「普通分配金／特別分配金」は明細右側の現金受取額を記録し、下部の「取引金額」と混同しません。再投資の取引金額は税引前の分配総額と一致しない場合があります。</div></section><section class="card"><div class="row"><b>分配金・再投資をスクショから取り込む</b><span class="tag">端末内で解析</span></div><p class="subtext">松井証券の「取引履歴」の再投資・普通分配金・特別分配金や、楽天証券の分配金履歴を読み取る機能です。画像から金額・銘柄・日付を抽出し、保存前に必ず確認できます。</p><div class="form2"><div class="field"><label>証券会社</label><select id="div-import-broker" onchange="ui.divImportBroker=this.value">${opts(brokers.filter(x=>x[0]!=='all'),ui.divImportBroker)}</select></div><div class="field"><label>取引履歴の画像（複数可）</label><input id="div-ocr-file" type="file" accept="image/*" multiple onchange="readDistributionImages(event)"></div></div>${ui.divOCRPreviews.length?`<div class="ocr-thumbs">${ui.divOCRPreviews.map((x,i)=>`<button class="ocr-thumb" onclick="showDivPreview(${i})"><img src="${x}" alt="分配金元画像 ${i+1}"><small>画像 ${i+1}</small></button>`).join('')}</div>`:''}${ui.divOCRNote?`<div class="alert">${cleanHTML(ui.divOCRNote)}</div>`:''}<div id="div-ocr-progress"></div><div class="field"><label>認識した文字（修正して再解析可能）</label><textarea id="div-ocr-raw" style="min-height:130px" placeholder="画像を選ぶとここに文字が表示されます">${cleanHTML(ui.divOCRText)}</textarea></div><button class="btn secondary" onclick="reparseDistributionText()">文字から再解析</button>${distributionCandidateUI()}<div class="fine" style="margin-top:12px">「普通分配金／特別分配金」は受取額を優先し、税引前の「取引金額」とは区別します。「再投資」の金額は現金受取ではありません。税務区分が不明な候補は「不明」のままで登録してください。銘柄・金額・日付の照合ができない候補は初期状態で未選択です。日付が画面外の過去明細は、日付を手入力してから登録してください。</div></section><div class="row"><h2 class="section-title">分配金の記録</h2><button class="btn small" onclick="divForm()">＋ 追加</button></div><section class="card">${list.length?list.map(x=>`<div class="distro-row"><div><b>${cleanHTML(fund(x.fundId)?.name||x.name||'未登録商品')}</b><div class="fine">${cleanHTML(x.date)}${x.sourceType==='reinvestment-transaction'?'（受渡日）':''} ｜ ${x.broker==='rakuten'?'楽天':'松井'} ｜ ${x.kind==='ordinary'?'普通':x.kind==='special'?'特別':'不明'} ｜ ${x.mode==='receive'?'受取':'再投資'}</div></div><div style="text-align:right"><b>${yen(x.amount)}</b><div class="actions"><button class="linklike" onclick="divForm('${cleanHTML(x.id)}')">編集</button><button class="linklike" style="color:#b55b55" onclick="removeDiv('${cleanHTML(x.id)}')">削除</button></div></div></div>`).join(''):`<div class="empty"><b>まだ分配金の記録はありません</b><p class="subtext">普通・特別、受取・再投資を分けて管理できます。</p><button class="btn secondary" onclick="divForm()">分配金を登録</button></div>`}</section>`;}
function imports(){return `<h2 class="section-title" style="margin-top:0">スクショから登録</h2><section class="card"><div class="row"><b>① 取り込む口座を選択</b><span class="tag">端末内で解析</span></div><div class="form2"><div class="field"><label for="import-broker">証券口座</label><select id="import-broker" onchange="ui.importBroker=this.value">${opts(brokers.filter(x=>x[0]!=='all'),ui.importBroker)}</select></div><div class="field"><label for="import-bucket">資産の種類</label><select id="import-bucket" onchange="ui.importBucket=this.value">${opts(buckets.filter(x=>x[0]!=='all'),ui.importBucket)}</select></div></div><div class="divider"></div><b>② 証券会社のスクショを選択</b><div class="field"><label for="ocr-file">松井証券の保有銘柄一覧・楽天証券の商品詳細（複数枚可）</label><input id="ocr-file" type="file" accept="image/*" multiple onchange="readImages(event)"></div><div class="info">画像は端末内で文字認識し、この取り込み機能からサーバーに送信しません。松井証券の一覧は銘柄ごとに拡大して再解析します。数量も読み取りますが誤認識があるため、口座・分類・評価額・取得額・保有口数を必ず確認してください。保存前に自動更新のON/OFFを選べます。</div>${ui.ocrPreviews.length?`<div class="field"><b>元のスクショを見ながら確認</b><p class="fine">画像をタップすると大きく表示します。元画像はページを閉じると破棄されます。</p><div class="ocr-thumbs">${ui.ocrPreviews.map((x,i)=>`<button class="ocr-thumb" onclick="showPreview(${i})"><img src="${x}" alt="取り込んだスクショ ${i+1}"><small>画像 ${i+1} を拡大</small></button>`).join('')}</div></div>`:''}${ui.ocrNote?`<div class="alert">${cleanHTML(ui.ocrNote)}</div>`:''}<div id="ocr-area"></div></section><section class="card"><b>読み取った文字を手動で修正・再解析</b><div class="field"><label for="ocr-raw">認識したテキスト</label><textarea id="ocr-raw" style="min-height:140px" placeholder="スクショを選ぶと解析テキストが入ります。必要なら修正できます。">${cleanHTML(ui.ocrText)}</textarea></div><div class="actions"><button class="btn secondary" onclick="parseFromText()">テキストから候補を探す</button><button class="btn outline" onclick="assetForm()">手入力で登録</button></div><p class="fine">投資信託名が認識できない場合や評価額を抽出できない場合は、手入力を使ってください。OCRの結果だけで自動保存しません。</p></section><section class="card"><b>③ 登録する内容を確認</b>${candidateUI()}</section>`;}
function candidateUI(){if(!ui.candidates.length)return `<p class="subtext">まだ登録候補がありません。上でスクショを読み取るか、手入力で追加できます。</p>`;return `<p class="fine">${ui.candidates.length}件の候補を検出しました。評価額・取得額・保有口数を元画像と照合してください。数量と価格が整合する候補は価格自動更新をONにできます。登録前は必ず確認してください。同じ商品・口座・区分・NISA投資枠の既存データだけを更新します。</p><div id="candidate-list">${ui.candidates.map((c,i)=>`<div class="candidate" data-candidate="${i}"><div class="row"><span class="candidate-title">候補 ${i+1}</span><label style="font-size:12px"><input type="checkbox" class="cand-keep" ${c.include?'checked':''}> 登録する</label></div><div class="field"><label>商品</label><select class="cand-fund">${opts([["custom","その他・自由入力"],...state.funds.map(f=>[f.id,f.name])],c.fundId||'custom')}</select></div><div class="field"><label>商品名（自由入力・照合用）</label><input class="cand-name" value="${cleanHTML(c.name||'')}"></div><div class="form2"><div class="field"><label>評価額（円）</label><input class="cand-value" inputmode="numeric" type="number" min="0" value="${c.value??''}"></div><div class="field"><label>取得額（円・任意）</label><input class="cand-cost" inputmode="numeric" type="number" min="0" value="${c.cost??''}"></div><div class="field"><label>${priceFactor(c.fundId)===1?'保有株数':'保有口数'}（スクショ読取／修正可）</label><input class="cand-units" inputmode="numeric" type="number" min="1" step="1" value="${c.units??''}" placeholder="読み取れない場合は空欄"></div><div class="field"><label>価格自動更新</label><label style="display:flex;align-items:center;gap:7px;padding:10px 0"><input type="checkbox" class="cand-auto" style="width:18px;min-height:18px" ${candidateAutoEligible(c)?'checked':''}> 有効にする</label></div><div class="field"> <div class="fine">${cleanHTML(candidatePriceNote(c))}</div></div><div class="field"><label>口座</label><select class="cand-broker">${opts(brokers.filter(x=>x[0]!=='all'),c.broker)}</select></div><div class="field"><label>区分</label><select class="cand-bucket" onchange="toggleCandidateNisaSlot(this)">${opts(buckets.filter(x=>x[0]!=='all'),c.bucket)}</select></div><div class="field cand-nisa-slot-field" style="display:${c.bucket==='nisa'?'block':'none'}"><label>NISA投資枠</label><select class="cand-slot">${opts(slots,c.slot||'unspecified')}</select></div></div><div class="fine">${cleanHTML(c.origin||'')}</div></div>`).join('')}</div><button class="btn" style="width:100%;margin-top:12px" onclick="saveCandidates()">チェックした候補を登録する</button>`}
function settings(){return `<h2 class="section-title" style="margin-top:0">設定・データ管理</h2>${priceSettings()}<section class="card"><b>資産の登録とバックアップ</b><p class="subtext">資産・分配金・組入情報は、この端末のブラウザ領域に保存されます。GitHubの公開ファイルには書き込みません。</p><div class="actions"><button class="btn" onclick="assetForm()">資産を追加</button><button class="btn secondary" onclick="exportData()">バックアップ保存</button></div><div class="field"><label for="backup-file">バックアップから復元（JSONファイル）</label><input type="file" accept=".json,application/json" id="backup-file" onchange="importData(event)"></div><div class="alert">端末の買い替えやSafariのデータ削除で保存情報が失われる場合があります。時々バックアップをダウンロードしてください。バックアップには資産額が含まれるため、取り扱いに注意してください。</div></section><section class="card"><b>組入情報を編集する</b><p class="subtext">上位銘柄と比率を、月次レポートに合わせて手動で編集できます。公式資料の自動取り込みは未実装です。</p><div class="field"><label for="editfund">編集する投信・ETF</label><select id="editfund">${opts(state.funds.map(f=>[f.id,f.name]),state.funds[0].id)}</select></div><div class="actions"><button class="btn secondary" onclick="editFund($('#editfund').value)">組入銘柄を編集</button><button class="btn outline" onclick="addFund()">商品を追加</button></div></section><section class="card"><b>登録済みデータ</b><div class="grid-2" style="margin:12px 0"><div class="metric"><div class="label">保有明細</div><b>${state.assets.length}件</b></div><div class="metric"><div class="label">分配金の記録</div><b>${state.dividends.length}件</b></div></div><div class="actions"><button class="btn danger small" onclick="clearAssets()">資産と分配金を全削除</button></div></section><section class="card"><b>データの注意点</b><p class="subtext">初期のインベスコ・WCMには第三者資料由来の未照合値が含まれます。THE 5Gの掲載割合は投資先ファンドの割合であり、当該投信全体の割合とは異なります。563Aの中身は投資先ETFとオプションを含めて別途確認が必要です。NISAのS&P500・オルカンの組入データは未登録です。</p><p class="subtext">計算した「企業別・国別・業種別の金額」は掲載銘柄に基づく参考推計であり、正確な実質投資額とは限りません。投資判断には運用会社の公式資料を確認してください。</p></section>`;}
function render(){const root=$('#main');root.innerHTML=ui.tab==='home'?home():ui.tab==='analysis'?analysis():ui.tab==='dividends'?distributions():ui.tab==='import'?imports():settings();const nav=[['home','ホーム','<path d="m3 10 9-7 9 7v10H3z"/><path d="M9 20v-7h6v7"/>'],['analysis','中身分析','<circle cx="12" cy="12" r="9"/><path d="M12 3v9l7 5"/>'],['dividends','分配金','<rect x="3" y="4" width="18" height="16" rx="2"/><path d="M3 9h18M7 14h4M15 14h2"/>'],['import','取り込み','<path d="M4 9V4h5M15 4h5v5M20 15v5h-5M9 20H4v-5M8 12h8M12 8v8"/>'],['settings','設定','<circle cx="12" cy="12" r="3"/><path d="M19 12a7 7 0 0 0-.2-1.6l2-1.6-2-3.5-2.5 1a7 7 0 0 0-2.5-1.5l-.4-2.7h-4l-.4 2.7a7 7 0 0 0-2.5 1.5l-2.5-1-2 3.5 2 1.6a7 7 0 0 0 0 3.2l-2 1.6 2 3.5 2.5-1a7 7 0 0 0 2.5 1.5l.4 2.7h4l.4-2.7a7 7 0 0 0 2.5-1.5l2.5 1 2-3.5-2-1.6A7 7 0 0 0 19 12Z"/>']];$('#tabs').innerHTML=nav.map(([k,l,path])=>`<button class="${ui.tab===k?'active':''}" onclick="go('${k}')"><svg viewBox="0 0 24 24" aria-hidden="true">${path}</svg>${l}</button>`).join('');}
function go(tab){ui.tab=tab;ui.modal='';$('#modal-root').innerHTML='';render();window.scrollTo({top:0,behavior:'instant'})}function changeBucket(v){ui.bucket=v;render()}function changeBroker(v){ui.broker=v;render()}function changeAnalysis(v){ui.analysis=v;render()}function changeYear(v){ui.year=+v;render()}

const aliases=[['invesco',/インベスコ|世界厳選株式|世界厳選/i],['wcm',/WCM|世界成長株/i],['the5g',/次世代通信関連|次世代通信|THE\s*5G|5G\s*\(?予想/i],['563a',/563A|GX\s*N\s*A\s*S\s*1\s*0\s*0.{0,22}カバ|GX\s*NASDAQ\s*100.{0,22}カバ|NASDAQ\s*100.{0,22}カバード/i],['435a',/435A/i],['divdevelop',/先進国.{0,12}好配当/i],['sp500',/S\s*&\s*P\s*500|S&P500|米国株式.{0,12}500/i],['allcountry',/オール.?カントリー|オルカン|全世界株式/i],['bull43',/4[.．]3\s*倍|日本株4[.．]3/i]];
function identify(line){const source=String(line||'').normalize('NFKC');const compact=source.replace(/[\s　]+/g,'');for(const [id,reg] of aliases)if(reg.test(source)||reg.test(compact))return id;return ''}
// 画面表示のラベルと数字を結びつける。カンマがピリオドと認識されるOCRにも対応。
function numberTokens(line){
  // 金額の桁区切りはOCRで「,」「.」「空白」になりやすい。
  const t=String(line||'').normalize('NFKC').replace(/[−ー―–]/g,'-').replace(/[，、]/g,',').replace(/(?<=\d)\s+(?=\d{3}(?:\D|$))/g,',');
  const re=/(?:[+\-]\s*)?(?:\d{1,3}(?:[,.]\s*\d{3})+|\d{4,12})(?![\d.,])/g;
  return [...t.matchAll(re)].map(m=>({v:Number(m[0].replace(/[\s,.]/g,'')),raw:m[0],pos:m.index})).filter(x=>Number.isFinite(x.v));
}
function ocrKey(x){return String(x||'').normalize('NFKC').replace(/[\s　_・]/g,'').replace(/[（()）]/g,'').replace(/\\/g,'').toLowerCase()}
const AMOUNT_LABELS={
  value:[/時価評価額/,/時価評価金額/,/評価額/,/評価金額/,/評価残高/,/時価総額/],
  profit:[/評価損益/,/評価益/,/含み損益/,/損益額/,/トータルリターン/],
  cost:[/取得総額/,/取得金額/,/取得額/,/買付金額/,/投資元本/]
};
const STOP_LABELS=[...Object.values(AMOUNT_LABELS).flat(),/基準価額/,/平均取得/,/保有数量/,/個別元本/,/分配金/,/口座区分/,/評価損益率/,/時価評価損益/];
function amountLine(line,kind){
 const s=String(line||'').normalize('NFKC').replace(/[−ー―–]/g,'-');
 const tokens=numberTokens(s).filter(x=>Math.abs(x.v)>=1000);
 if(!tokens.length)return null;
 // 一つの項目に「円」「%」が同時掲載されても、円表示の数字を選ぶ。
 const cand=tokens.find(x=>/円/.test(s.slice(x.pos+x.raw.length,x.pos+x.raw.length+8)))||tokens[0];
 if((kind==='value'||kind==='cost')&&cand.v<=0)return null;
 return cand.v;
}
function recognizedLabel(line,kind){
 // 「時 価 評 価 額」のように文字間に空白が入っても判定できる。
 const k=ocrKey(line);return AMOUNT_LABELS[kind].some(r=>r.test(k));
}
function otherLabel(line,kind){
 const k=ocrKey(line);
 const own=AMOUNT_LABELS[kind].some(r=>r.test(k));
 return !own&&STOP_LABELS.some(r=>r.test(k));
}
function labelValue(block,kind){
  const lines=block.map(x=>String(x||'').normalize('NFKC'));
  // OCRの並びがラベル→金額に限らないため、直前の行も対象。
  for(let i=0;i<lines.length;i++){
    if(!recognizedLabel(lines[i],kind))continue;
    const s=lines[i],k=ocrKey(s);
    // ラベルと同じ行に数字がある場合、数値を優先。
    let val=amountLine(s,kind);
    if(val!==null)return val;
    // iPhoneのOCRはラベルと金額を別々の行にする。
    for(let step=1;step<=5&&i+step<lines.length;step++){
      let line=lines[i+step];
      if(otherLabel(line,kind))break;
      val=amountLine(line,kind);
      if(val!==null)return val;
    }
    // レイアウトの列順序が逆転した場合に限り一つ前の行を検討。
    if(i>0&&!STOP_LABELS.some(r=>r.test(ocrKey(lines[i-1])))){
      val=amountLine(lines[i-1],kind);if(val!==null)return val;
    }
  }
  return null;
}
function findProfit(block){
 let result=labelValue(block,'profit');
 if(result!==null)return result;
 // 評価損益「+599,934 円」「+ 599,934円」など、符号付きの金額だけを救済。
 for(let i=0;i<block.length;i++){
   if(!/評価損益|損益率|トータルリターン/.test(ocrKey(block[i])))continue;
   for(let j=i;j<=Math.min(i+4,block.length-1);j++){
     if(j>i&&otherLabel(block[j],'profit'))break;
     const m=String(block[j]).normalize('NFKC').match(/([+\-−])\s*(\d{1,3}(?:[,.]\s*\d{3})+|\d{4,10})\s*円?/);
     if(m){let val=Number(m[2].replace(/[\s,.]/g,''));return m[1]==='+'?val:-val;}
   }
 }
 return null;
}
// OCRで「1,006,764」が「6,764」となる場合、損益率を照合して誤登録を防ぐ。
function profitPercentInBlock(block){
 for(let i=0;i<block.length;i++){
  if(!recognizedLabel(block[i],'profit'))continue;
  for(let j=i;j<=Math.min(i+2,block.length-1);j++){
   if(j>i&&otherLabel(block[j],'profit'))break;
   const s=String(block[j]).normalize('NFKC').replace(/[−ー―–]/g,'-');
   // 率が明示された数字だけを参照し、基準価額や評価額を率として使わない。
   const match=s.match(/([+\-]?\d{1,3}(?:[.,]\d{1,2})?)\s*%/);
   if(match)return Number(match[1].replace(',','.'));
  }
 }
 return null;
}
// 楽天証券のETF保有詳細（563A等）は表の見出しと右列の金額が分離して
// 認識される。株数×現在株価／取得総額＋評価損益で独立に検算する。
function etfQuantityAndPrice(text){
 const ls=String(text||'').normalize('NFKC').replace(/[−ー―–]/g,'-').split('\n').map(x=>x.trim()).filter(Boolean);
 let quantity=null,price=null;
 for(let i=0;i<ls.length;i++){
  const row=ocrKey(ls[i]);
  if(/保有数量/.test(row)){
   for(const v of ls.slice(i,i+5)){
    const m=v.normalize('NFKC').match(/(\d{1,3}(?:,\d{3})+|\d{1,7})\s*株/);
    if(m){quantity=Number(m[1].replace(/,/g,''));break;}
   }
  }
  if(/株価/.test(row)&&!/平均取得|取得総額/.test(row)){
   for(const v of ls.slice(i,i+5)){
    // 株価の小数を桁区切りの整数と混同しない。
    const m=v.normalize('NFKC').replace(/[−ー―–]/g,'-').match(/(?:^|[^\d-])(\d{1,3}(?:,\d{3})*(?:\.\d{1,2})?|\d{4,6}(?:\.\d{1,2})?)(?=\s*(?:円|\(|$|\s))/);
    if(m){const n=Number(m[1].replace(/,/g,''));if(n>=50&&n<=100000){price=n;break;}}
   }
  }
 }
 return {quantity,price,value:quantity!==null&&price!==null?Math.round(quantity*price):null};
}
// 投信は「口」、ETFは「株」。評価額・基準価額から数量を逆算しない。
// 楽天証券の商品詳細、松井証券の銘柄詳細の両方で、数量ラベルと数値を結びつける。
function quantityFromBlock(lines, fundId){
 const rows=Array.isArray(lines)?lines:String(lines||'').split(/\r?\n/);
 const label=/(?:保有数量|保有口数|保有株数|保有数最|保有残高|現在の保有数量)/;
 const unrelated=/(?:評価額|評価損益|取得総額|取得金額|平均取得|個別元本|基準価額|時価|トータルリターン|分配金|注文数量|約定数量|取引数量|口座区分)/;
 const stock=['563a','435a'].includes(fundId);
 function quantityNumber(row, requireUnit){
  const line=String(row||'').normalize('NFKC').replace(/[，、]/g,',').replace(/(?<=\d)\s+(?=\d{3}(?:\D|$))/g,',');
  const re=/(?:\d{1,3}(?:[,\.]\d{3})+|\d{1,11})(?!\d)\s*(口|株|株数)?/g;
  for(const match of line.matchAll(re)){
   const suffix=match[1]||'';
   if(requireUnit&&!suffix)continue;
   if(stock&&suffix==='口')continue;
   if(!stock&&suffix==='株')continue;
   // 価格（円）や少数小数値を数量と混同しない。
   const before=line.slice(Math.max(0,match.index-4),match.index);
   const after=line.slice(match.index+match[0].length,match.index+match[0].length+3);
   if(/円|%|日時|2026/.test(after)||/価格|単価|金額|時刻/.test(before))continue;
   const value=Number(match[0].replace(/[,.\s口株数]/g,''));
   if(Number.isSafeInteger(value)&&value>0&&value<=1e11)return value;
  }
  return null;
 }
 const values=[];
 for(let i=0;i<rows.length;i++){
  if(!label.test(ocrKey(rows[i])))continue;
  // 最初にラベルと同じ行、その後はラベル直下の最大3行。
  // 他の金額ラベルが先に出た場合は横断しない。
  for(let j=i;j<=Math.min(i+3,rows.length-1);j++){
   if(j>i&&(unrelated.test(ocrKey(rows[j]))||label.test(ocrKey(rows[j]))))break;
   const line=String(rows[j]||'').normalize('NFKC');

     chunks.push(extra);cands.push(...parseDistributionText(extra,ui.divImportBroker));
    }
    raw+='\n【拡大再認識】\n'+chunks.join('\n');
    // 銘柄と受取額が別の拡大領域にある場合に限り同一画像内で補完する。
    cands.push(...parseDistributionText(raw,ui.divImportBroker));
   }
   ui.divOCRText+=`【画像 ${i+1}】\n${raw}\n`;
   ui.divCandidates=mergeDistributionCandidates([...ui.divCandidates,...cands.map(c=>({...c,sourceImage:i}))]);
  }
  ui.divOCRNote=ui.divCandidates.length?`${ui.divCandidates.length}件の候補を読み取りました。未確定の金額・日付は元画像で確認し、必要なものだけ登録してください。`:'該当する再投資・分配金の明細を見つけられませんでした。認識文字を修正して再解析、または手入力してください。';
 }catch(e){ui.divOCRNote='画像を解析できませんでした：'+e.message+'。手入力でも登録できます。';}
 finally{if(worker)try{await worker.terminate()}catch(_){}render();}
}
function saveDistributionCandidates(){
 let count=0,duplicates=0;
 for(const row of $$('#div-candidate-list .candidate')){
  if(!row.querySelector('.div-keep').checked)continue;
  const amountEl=row.querySelector('.div-amount'),date=row.querySelector('.div-date').value,amount=Number(amountEl.value),fundId=row.querySelector('.div-fund').value,broker=row.querySelector('.div-broker').value,mode=row.querySelector('.div-mode').value,bucket=row.querySelector('.div-bucket').value,kind=row.querySelector('.div-kind').value;
  if(!date||!amountEl.value||!Number.isFinite(amount)||amount<=0){alert('金額と日付を確認してください');return;}
  const exists=state.dividends.some(d=>d.fundId===fundId&&d.broker===broker&&d.date===date&&d.mode===mode&&d.amount===amount);
  if(exists){duplicates++;continue;}
  const original=ui.divCandidates[Number(row.dataset.divcandidate)]||{};state.dividends.push({id:uid(),date,amount,fundId,broker,mode,bucket,kind,sourceType:mode==='reinvest'?'reinvestment-transaction':'payment-history',grossAmount:original.grossAmount??null});count++;
 }
 if(count===0){alert(duplicates?'同じ記録がすでに登録されています。重複を追加しませんでした。':'登録する候補にチェックを入れて金額・日付を確認してください。');return;}
 if(!persist())return;
 ui.divCandidates=[];ui.divOCRText='';ui.divOCRPreviews=[];ui.bucket='income';ui.broker='all';ui.tab='dividends';render();
 alert(count+'件を保存しました。'+(duplicates?'重複 '+duplicates+'件は追加していません。':'')+'再投資取引は現金受取に含まれません。');
}
function saveCandidates(){
 let count=0,autoCount=0,qtyCount=0;
 const next=state.assets.map(a=>({...a}));
 for(const row of $$('#candidate-list .candidate')){
  if(!row.querySelector('.cand-keep').checked)continue;
  const fundId=row.querySelector('.cand-fund').value,name=row.querySelector('.cand-name').value.trim()||fund(fundId)?.name||'';
  const valEl=row.querySelector('.cand-value'),value=Number(valEl.value),costEl=row.querySelector('.cand-cost'),cost=costEl.value.trim()===''?null:Number(costEl.value);
  if(!name||valEl.value===''||!Number.isFinite(value)||value<0||cost!==null&&(!Number.isFinite(cost)||cost<0)){alert('商品名・評価額・取得額を確認してください');return;}
  const unitsEl=row.querySelector('.cand-units'),qtyRaw=unitsEl.value.trim(),readUnits=qtyRaw===''?null:Number(qtyRaw);
  if(readUnits!==null&&(!Number.isSafeInteger(readUnits)||readUnits<=0)){alert('保有数量は1以上の整数で入力してください');return;}
  const autoRequested=row.querySelector('.cand-auto').checked;
  const broker=row.querySelector('.cand-broker').value,bucket=row.querySelector('.cand-bucket').value,slot=bucket==='nisa'?row.querySelector('.cand-slot').value:'unspecified';
  const matches=a=>a.fundId===fundId&&a.broker===broker&&a.bucket===bucket&&(fundId!=='custom'||a.name===name);
  let existing=next.find(a=>matches(a)&&(a.slot||'unspecified')===slot);
  if(!existing&&bucket==='nisa'&&slot!=='unspecified')existing=next.find(a=>matches(a)&&(!a.slot||a.slot==='unspecified')&&Number(a.value)===value&&(a.cost===null||a.cost===''||cost===null||Number(a.cost)===cost));
  if(!existing&&bucket==='nisa'&&slot==='unspecified'&&next.some(a=>matches(a))){alert('同じNISA商品が登録されています。投資枠を選んでください');return;}
  const units=readUnits??existing?.units??null;
  if(existing&&readUnits!==null&&existing.units!==null&&existing.units!==undefined&&Number(existing.units)>0&&Number(existing.units)!==readUnits){
   if(!confirm('既存の保有口数 '+Number(existing.units).toLocaleString('ja-JP')+' を '+readUnits.toLocaleString('ja-JP')+' に変更しますか？\n買い増し・再投資の後なら新しいスクショを優先してください。'))return;
  }
  if(autoRequested&&(!Number.isSafeInteger(Number(units))||Number(units)<=0)){alert('自動更新には保有口数・株数が必要です');return;}
  const q=quoteFor(fundId);
  if(autoRequested&&!validQuote(q)){alert('この銘柄の価格データがありません。自動更新のチェックを外して登録してください');return;}
  if(autoRequested&&['sp500','allcountry'].includes(fundId)&&q.source!=='手入力'&&!/eMAXIS\s*Slim/i.test(name)){alert('別運用会社の投信をeMAXIS Slimの価格で更新できません');return;}
  if(autoRequested){
   const calculated=Math.round(Number(units)/priceFactor(fundId)*Number(q.price));
   if(calculated<=0||Math.abs(calculated-value)/Math.max(calculated,value)>.08){
    if(!confirm('保有数量×公開価格の試算がスクショの評価額と8%以上異なります。数量・銘柄・価格日を再確認しましたか？'))return;
   }
  }
  // 数量が写っていない新スクショでも、過去に確認済みの数量設定は破棄しない。
  // 自動更新は候補ごとの確認欄で明示的に選んだときだけON。
  const unchangedUnits=existing&&Number(existing.units)===Number(units);
  const a={id:existing?.id||uid(),fundId,name,value,cost,broker,bucket,slot,units,autoPrice:autoRequested,
    priceDate:null,
    priceSource:'',
    updated:new Date().toLocaleDateString('sv-SE')};
  if(existing)Object.assign(existing,a);else next.push(a);
  if(readUnits!==null)qtyCount++;
  if(autoRequested)autoCount++;
  count++;
 }
 if(!count){alert('登録する候補にチェックを入れてください');return;}
 const before=state.assets;state.assets=next;
 if(!persist()){state.assets=before;return;}
 ui.candidates=[];ui.ocrText='';ui.bucket='all';ui.broker='all';go('home');
 if(autoCount)applyPriceUpdates(false);
 alert(count+'件を保存。保有数量 '+qtyCount+'件、価格自動更新ON '+autoCount+'件。\n取引や再投資で保有口数が増えたら新しいスクショで更新してください。');
}

render();
loadPrices();
</script>
