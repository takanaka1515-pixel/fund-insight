name: 投信の中身・公開価格の取得とPages配信

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '15 14 * * 1-5'  # 平日23:15 JST（日本の祝日も実行対象）

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: fund-insight-pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Fetch public NAV quotes
        run: python3 fetch_prices.py

      - name: Commit verified NAV quotes when changed
        run: |
          if git diff --quiet -- prices.json; then
            echo '価格ファイルに変更はありません（取得失敗時は従来値を保持）'
          else
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add prices.json
            git commit -m 'Update verified public NAV quotes'
            git push
          fi

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: .

      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
